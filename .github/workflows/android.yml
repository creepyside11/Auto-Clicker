name: Build & Release APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit tests (движок + OCR)
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -print
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK" "out/MathAI-1.0.${{ github.run_number }}.apk"
          cp "$APK" "out/MathAI.apk"
          ls -lh out

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathAI-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MathAI 1.0.${{ github.run_number }}
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            ## MathAI 1.0.${{ github.run_number }}

            Локальная нейросеть, которая читает математические примеры с фото
            и решает их по шагам. Всё считается на устройстве, интернет не нужен.

            **Быстрая ссылка:** [MathAI.apk](https://github.com/creepyside11/Auto-Clicker/releases/latest/download/MathAI.apk)

            ### Что умеет
            - ввод примеров текстом и по фото (галерея, камера, «Поделиться»);
            - распознавание цифр, знаков, дробей, корней (√, ∛) и степеней;
            - точная арифметика: дроби, проценты, факториал, π, тригонометрия, логарифмы;
            - решение линейных и квадратных уравнений (`2x+3=7`, `x^2-5x+6=0`);
            - пошаговое решение.

            ### Установка
            1. Скачайте `MathAI-*.apk` ниже.
            2. Разрешите установку из этого источника.
          files: out/*.apk
